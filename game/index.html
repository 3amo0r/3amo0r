<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10131c" />
    <meta name="description"
      content="The AAST 2026 Odyssey — a pixel-art RPG about five years of Computer Engineering at AASTMT, starring the whole class." />
    <meta property="og:title" content="The AAST 2026 Odyssey" />
    <meta property="og:description" content="خمس سنين في لعبة واحدة. Escape Building G and graduate." />
    <meta property="og:type" content="website" />
    <title>The AAST 2026 Odyssey</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2310131c'/%3E%3Crect x='2' y='6' width='12' height='2' fill='%23ffc94a'/%3E%3Crect x='4' y='4' width='8' height='2' fill='%23ffc94a'/%3E%3Crect x='12' y='8' width='1' height='4' fill='%234fe0a8'/%3E%3Crect x='11' y='11' width='3' height='2' fill='%234fe0a8'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tajawal:wght@400;700&display=swap"
      rel="stylesheet" />

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #10131c;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Tajawal", system-ui, sans-serif;
      }
      #game { width: 100%; height: 100%; }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      /* Phaser's DOM layer holds the name and quote inputs. */
      #game input { font-family: "Tajawal", system-ui, sans-serif; }

      #boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        color: #8ea3c4;
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        line-height: 1.9;
        pointer-events: none;
      }
      #boot-fallback strong { color: #ffc94a; font-size: 13px; }

      /* Most of the class will open this on a phone. A 16:9 game squeezed into
         a portrait screen is a postage stamp, so ask for landscape instead. */
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        html:not(.force-play) #game,
        html:not(.force-play) #boot-fallback { display: none !important; }
        html.force-play #rotate { display: none; }
        #rotate {
          position: fixed;
          inset: 0;
          display: grid;
          place-content: center;
          justify-items: center;
          gap: 18px;
          padding: 24px;
          text-align: center;
          background: #10131c;
          color: #e8eef7;
          z-index: 50;
        }
        #rotate .phone {
          width: 54px;
          height: 92px;
          border: 4px solid #8ea3c4;
          border-radius: 8px;
          animation: tip 2s ease-in-out infinite;
        }
        #rotate .phone::after {
          content: "";
          display: block;
          width: 20px;
          height: 3px;
          margin: 76px auto 0;
          background: #8ea3c4;
          border-radius: 2px;
        }
        #rotate h1 {
          margin: 0;
          font-family: "Press Start 2P", monospace;
          font-size: 11px;
          line-height: 1.8;
          color: #ffc94a;
        }
        #rotate p { margin: 0; font-size: 15px; color: #8ea3c4; line-height: 1.7; }
        #play-anyway {
          margin-top: 6px;
          padding: 10px 16px;
          border: 2px solid #4a5b7d;
          border-radius: 4px;
          background: transparent;
          color: #8ea3c4;
          font-family: "Tajawal", system-ui, sans-serif;
          font-size: 14px;
          cursor: pointer;
        }
      }
      @keyframes tip {
        0%, 45% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }

      #fullscreen {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        inset-inline-end: max(8px, env(safe-area-inset-right));
        z-index: 40;
        display: none;
        padding: 7px 10px;
        border: 2px solid #4a5b7d;
        border-radius: 4px;
        background: rgba(16, 19, 28, 0.75);
        color: #8ea3c4;
        font-family: "Press Start 2P", monospace;
        font-size: 8px;
        cursor: pointer;
      }
      @media (pointer: coarse) and (orientation: landscape) {
        #fullscreen { display: block; }
      }
      @media (prefers-reduced-motion: no-preference) {
        #boot-fallback span { animation: blink 1.1s steps(2, start) infinite; }
      }
      @keyframes blink { to { opacity: 0.25; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-fallback">
      <strong>THE AAST 2026 ODYSSEY</strong>
      <span>LOADING...</span>
    </div>
    <div id="rotate">
      <div class="phone"></div>
      <h1>ROTATE YOUR PHONE</h1>
      <p>لفّ الموبايل بالعرض عشان تلعب<br />The campus needs a wider screen.</p>
      <button id="play-anyway" type="button">العب برضه · Play anyway</button>
    </div>
    <button id="fullscreen" type="button">FULLSCREEN</button>
    <noscript>
      <p style="color:#e8eef7;font-family:sans-serif;text-align:center">
        محتاج تفعّل JavaScript عشان اللعبة تشتغل.
      </p>
    </noscript>
    <script>
      // Fullscreen on phones, and landscape lock where the browser allows it.
      // Nobody gets locked out: tablets and locked-orientation phones can opt in.
      document.getElementById('play-anyway')?.addEventListener('click', () => {
        document.documentElement.classList.add('force-play');
        window.dispatchEvent(new Event('resize'));
      });

      document.getElementById('fullscreen')?.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
          await screen.orientation?.lock?.('landscape');
        } catch {
          /* Safari on iOS refuses both; the game still plays fine. */
        }
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
